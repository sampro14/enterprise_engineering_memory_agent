name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: memory
          POSTGRES_PASSWORD: memory
          POSTGRES_DB: memory
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U memory -d memory"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL_TEST: postgresql://memory:memory@localhost:5432/memory
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run ruff check src tests eval scripts
      - name: Offline unit tests (SQLite + fake providers)
        run: uv run pytest -q -m "not integration"
      - name: Integration tests (Postgres + pgvector)
        run: DATABASE_URL=$DATABASE_URL_TEST uv run pytest -q -m integration
