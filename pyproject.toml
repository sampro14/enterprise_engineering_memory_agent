[project]
name = "memory-agent"
version = "0.1.0"
description = "Enterprise Engineering Memory Agent (PoC)"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=1.0",
    "pydantic>=2.7",
    "langgraph>=0.2",
    "numpy>=1.26",
    "typer>=0.12",
    "rich>=13.7",
    "python-dotenv>=1.0",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.54.0",
    "psycopg[binary,pool]>=3.3.6",
    "anthropic>=1.8.0",
    "openai>=3.19.2",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
    "ruff>=0.5",
]

[project.scripts]
memory-agent = "memory_agent.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memory_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = ["integration: needs Postgres (set DATABASE_URL)", "live: calls a real LLM provider (set RUN_LIVE=1)"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "eval"]

[tool.ruff.lint]
ignore = ["C408", "B008"]
