[project]
name = "memory-agent"
version = "0.1.0"
description = "Enterprise Engineering Memory Agent (PoC)"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=1.0",
    "pydantic>=2.7",
    "langgraph>=0.2",
    "numpy>=1.26",
    "typer>=0.12",
    "rich>=13.7",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
memory-agent = "memory_agent.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memory_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
src = ["src", "tests", "eval"]

[tool.ruff.lint]
ignore = ["C408", "B008"]
